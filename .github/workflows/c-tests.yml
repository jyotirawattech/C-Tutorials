name: C practice checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sanitizers: address,undefined
          - os: macos-latest
            sanitizers: undefined
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run solution tests and runner failure regressions
        env:
          CC: clang
          LEAK_CHECK: auto
          SANITIZERS: ${{ matrix.sanitizers }}
        run: make test
      - name: Verify accepted archive integrity and compile objects (no execution)
        run: make test-accepted
      - name: Verify all comparison records and judge snapshot provenance
        run: make test-comparisons
